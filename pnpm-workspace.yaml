packages:
  - apps/*
  - packages/*

allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  vue-demi: true
  workerd: true

patchedDependencies:
  '@adonisjs/auth@10.1.0': patches/@adonisjs__auth@10.1.0.patch

overrides:
  typescript: ^6

minimumReleaseAgeExclude:
  - '@nuxtjs/robots@7.1.0'
  - '@nuxtjs/seo@6.1.0'
  - '@nuxtjs/sitemap@9.2.0'
  - '@unhead/bundler@3.5.0'
  - '@unhead/vue@3.5.0'
  - nuxt-ai-ready@3.6.1
  - nuxt-link-checker@6.0.2
  - nuxt-og-image@7.1.1
  - nuxt-schema-org@7.1.1
  - nuxt-seo-utils@9.1.0
  - nuxt-site-config-kit@5.0.4
  - nuxt-site-config@5.0.4
  - nuxt-skew-protection@2.0.6
  - site-config-stack@5.0.4
  - unhead@3.5.0
