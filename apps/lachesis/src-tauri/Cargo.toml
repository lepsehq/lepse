[package]
name = "lepse"
description = "A personal life operating system for top-down \"productivity\"."
authors = ["zorvi"]
repository = "https://github.com/lepsehq/lepse"
edition = "2021"
rust-version = "1.93"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lepse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "3.0.0-alpha.5", features = [
  "tray-icon",
  "image-png",
  "devtools",
] }
tauri-runtime-wry = { version = "3.0.0-alpha.5", optional = true }
tauri-runtime-cef = { version = "3.0.0-alpha.6", optional = true }
tauri-plugin-log = "3.0.0-alpha.3"
tauri-plugin-os = "3.0.0-alpha.3"
tauri-plugin-store = "3.0.0-alpha.3"
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
tauri-plugin-notification = "3.0.0-alpha.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "3.0.0-alpha.3"
tauri-plugin-updater = "3.0.0-alpha.3"

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = "0.6.0"
glib = { version = "0.22.10", optional = true } # version taken from cargo tree, so a duplicate version isn't used

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring-core = "1.0.0"
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[features]
default = ["wry"]
wry = ["dep:tauri-runtime-wry"]
cef = ["dep:tauri-runtime-cef", "glib"]

[patch.crates-io]
tauri = { git = "https://github.com/lepsehq/tauri", rev = "37c0723f7c9bd421a58dabd84d78f35f7114c2a4" }             # v3.0.0-alpha.5+lepse
tauri-build = { git = "https://github.com/lepsehq/tauri", rev = "37c0723f7c9bd421a58dabd84d78f35f7114c2a4" }       # v3.0.0-alpha.5+lepse
tauri-utils = { git = "https://github.com/lepsehq/tauri", rev = "37c0723f7c9bd421a58dabd84d78f35f7114c2a4" }       # v3.0.0-alpha.5+lepse
tauri-runtime-wry = { git = "https://github.com/lepsehq/tauri", rev = "37c0723f7c9bd421a58dabd84d78f35f7114c2a4" } # v3.0.0-alpha.5+lepse
tauri-runtime-cef = { git = "https://github.com/lepsehq/tauri", rev = "37c0723f7c9bd421a58dabd84d78f35f7114c2a4" } # v3.0.0-alpha.5+lepse
tray-icon = { git = "https://github.com/aervxa/tray-icon", rev = "d2212b4baf8556ee0fe3d3ea65966b506f95a2b7" }
