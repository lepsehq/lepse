name: Lepse (Lachesis) Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release-lachesis:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-26 # macOS arm64
          - macos-26-intel # macOS x64 (pre M1)
          - ubuntu-26.04 # Linux x64
          - ubuntu-26.04-arm # Linux arm64
          - windows-2025 # Windows x64
          - windows-11-arm # Windows arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libgtk-4-dev

      - name: Install pnpm
        uses: pnpm/setup@v3
        with:
          version: 12.6.0
          runtime: node@24
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'apps/lachesis/src-tauri -> target' # 'rust build location -> output dir'

      # Cache CEF locations by key os-arch-cef_version
      # cache paths listed here: https://v3.tauri.app/develop/cef/#prerequisites
      - id: cef
        shell: bash
        working-directory: apps/lachesis/src-tauri
        run: echo "version=$(cargo pkgid tauri-runtime-cef)" >> "$GITHUB_OUTPUT" # returns a unique version id
      - name: Setup CEF cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/tauri-cef' || runner.os == 'Windows' && '~/AppData/Local/tauri-cef' || '~/.cache/tauri-cef' }}
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}

      - name: Install app dependencies
        run: pnpm install --filter @lepse/lachesis... # ... downloads also the deps of the filtered app

      - name: Build Lachesis
        uses: tauri-apps/tauri-action@v1
        env:
          NUXT_PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/lachesis
          args: '--features cef -- --no-default-features'
          tagName: v__VERSION__
          releaseName: 'Lepse v__VERSION__'
          releaseBody: "Below are all assets for this version. It's recommended to [download the app from the site](https://lepse.app), but if you know what you're doing, go ahead!"
